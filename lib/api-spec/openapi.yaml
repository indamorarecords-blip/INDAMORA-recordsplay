openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Public catalog operations
  - name: artists
    description: Artist profile operations
  - name: submissions
    description: INDAMORA RECORDS moderation operations
  - name: press
    description: Public press contact operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: List featured content
      responses:
        "200":
          description: Public content catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Work"
  /catalog/{id}:
    get:
      operationId: getWork
      tags: [catalog]
      summary: Get a work by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Work details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Work"
        "404":
          description: Work not found
  /artists:
    get:
      operationId: getArtists
      tags: [artists]
      summary: List public directory profiles
      parameters:
        - name: group
          in: query
          required: false
          schema:
            type: string
            enum: [artists, creations, partners, press]
        - name: subcategory
          in: query
          required: false
          schema: { type: string }
        - name: country
          in: query
          required: false
          schema: { type: string }
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Artist profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artist"
    post:
      operationId: createArtist
      tags: [artists]
      summary: Create an artist profile
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtistInput"
      responses:
        "201":
          description: Artist profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
  /artists/{id}:
    get:
      operationId: getArtist
      tags: [artists]
      summary: Get an artist profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "404":
          description: Artist not found
  /press-requests:
    post:
      operationId: createPressRequest
      tags: [press]
      summary: Send a press or media request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PressRequestInput"
      responses:
        "201":
          description: Press request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PressRequest"
  /submissions:
    get:
      operationId: getSubmissions
      tags: [submissions]
      summary: List work submissions
      security:
        - clerkSession: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Submitted works
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a work for review
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /submissions/{id}/status:
    patch:
      operationId: updateSubmissionStatus
      tags: [submissions]
      summary: Update a submission review status
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionStatusInput"
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a presigned URL for direct upload
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /storage/uploads/complete:
    post:
      operationId: completeUpload
      tags: [Storage]
      summary: Attach owner ACL metadata to an uploaded object
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "200":
          description: Uploaded object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteUploadResult"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [Storage]
      summary: Serve a public object
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema: { type: string, format: binary }
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [Storage]
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema: { type: string, format: binary }
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Artist:
      type: object
      required: [id, name, category, bio, location, worksCount, profileGroup, specialties, socialLinks]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        bio: { type: string }
        location: { type: string }
        avatar: { type: ["string", "null"] }
        worksCount: { type: integer }
        profileGroup:
          type: string
          enum: [artists, creations, partners, press]
        subcategory: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        specialties:
          type: array
          items: { type: string }
        website: { type: ["string", "null"], format: uri }
        socialLinks:
          type: array
          items: { type: string, format: uri }
        professionalContact: { type: ["string", "null"] }
    ArtistInput:
      type: object
      required: [name, category, bio, location]
      properties:
        name: { type: string, minLength: 2 }
        category: { type: string, minLength: 2 }
        bio: { type: string, minLength: 10 }
        location: { type: string, minLength: 2 }
        avatar: { type: string }
        profileGroup:
          type: string
          enum: [artists, creations, partners, press]
        subcategory: { type: string }
        country: { type: string }
        specialties:
          type: array
          items: { type: string }
        website: { type: string, format: uri }
        socialLinks:
          type: array
          items: { type: string, format: uri }
        professionalContact: { type: string }
    PressRequest:
      type: object
      required: [id, name, organization, role, email, requestType, subject, message, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        organization: { type: string }
        role: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        requestType: { type: string }
        subject: { type: string }
        message: { type: string }
        requestedDate: { type: ["string", "null"] }
        status: { type: string, enum: [pending, handled, archived] }
        createdAt: { type: string }
    PressRequestInput:
      type: object
      required: [name, organization, role, email, requestType, subject, message]
      properties:
        name: { type: string, minLength: 2 }
        organization: { type: string, minLength: 2 }
        role: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string }
        requestType: { type: string, minLength: 2 }
        subject: { type: string, minLength: 2 }
        message: { type: string, minLength: 10 }
        requestedDate: { type: string }
    Work:
      type: object
      required: [id, title, artist, category, description, duration, image, featured, access, mediaType, mediaObjectPath, coverObjectPath]
      properties:
        id: { type: integer }
        title: { type: string }
        artist: { type: string }
        category: { type: string }
        description: { type: string }
        duration: { type: ["string", "null"] }
        image: { type: string }
        mediaType: { type: ["string", "null"] }
        mediaObjectPath: { type: ["string", "null"] }
        coverObjectPath: { type: ["string", "null"] }
        featured: { type: boolean }
        access:
          type: string
          enum: [free, premium]
    Submission:
      type: object
      required: [id, title, artist, category, submittedAt, status]
      properties:
        id: { type: integer }
        title: { type: string }
        artist: { type: string }
        category: { type: string }
        submittedAt: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
        note: { type: ["string", "null"] }
        mediaType: { type: ["string", "null"] }
        mediaObjectPath: { type: ["string", "null"] }
        coverObjectPath: { type: ["string", "null"] }
        duration: { type: ["string", "null"] }
    SubmissionInput:
      type: object
      required: [title, artist, category, mediaType, mediaObjectPath]
      properties:
        title: { type: string, minLength: 2 }
        artist: { type: string, minLength: 2 }
        category: { type: string, minLength: 2 }
        note: { type: string }
        mediaType:
          type: string
          enum: [audio, video]
        mediaObjectPath: { type: string, minLength: 1 }
        coverObjectPath: { type: string, minLength: 1 }
        duration: { type: string }
    SubmissionStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    CompleteUploadRequest:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, minLength: 1 }
    CompleteUploadResult:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string }

