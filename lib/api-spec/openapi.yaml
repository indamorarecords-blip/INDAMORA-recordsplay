openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Public catalog operations
  - name: artists
    description: Artist profile operations
  - name: submissions
    description: INDAMORA RECORDS moderation operations
  - name: press
    description: Public press contact operations
  - name: billing
    description: INDAMORA Premium and Stripe checkout operations
  - name: store
    description: INDAMORA PLAY storefront and one-time TEST checkout
  - name: admin
    description: Private administration operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /shop/admin:
    get:
      operationId: getShopAdmin
      responses:
        "200":
          description: Private administrator dashboard, development only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopDashboard"
  /shop/admin/products:
    post:
      operationId: createShopProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopProductInput"
      responses:
        "200":
          description: Product saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProduct"
  /shop/admin/products/{id}:
    put:
      operationId: updateShopProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopProductUpdateInput"
      responses:
        "200":
          description: Product saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProduct"
  /shop/admin/photos:
    post:
      operationId: uploadShopPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopPhotoUpload"
      responses:
        "200":
          description: Image validated and privately stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopPhoto"
  /shop/admin/photos/request-url:
    post:
      operationId: requestShopPhotoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopPhotoRequest"
      responses:
        "200":
          description: ADMIN-only presigned upload into private App Storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopPhotoUploadUrl"
  /shop/admin/photos/complete:
    post:
      operationId: completeShopPhotoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopPhotoCompletion"
      responses:
        "200":
          description: Actual object bytes checked by the server, no public ACL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopPhoto"
  /shop/admin/orders:
    get:
      operationId: getShopOrders
      responses:
        "200":
          description: Real Stripe TEST sessions only, no customer personal information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrders"
  /shop/catalog:
    get:
      operationId: getShopCatalog
      responses:
        "200":
          description: Active customer-facing products; no internal stock counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopPublicCatalog"
  /shop/quote:
    post:
      operationId: createShopQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopQuoteInput"
      responses:
        "200":
          description: Server calculated prices, availability and shipping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopQuote"
  /analytics/pageviews:
    post:
      operationId: recordPageview
      tags: [admin]
      summary: Record an anonymous public page visit; never returns statistics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageviewInput"
      responses:
        "204":
          description: Visit accepted or excluded by privacy and bot filters
        "400":
          description: Invalid public page
        "403":
          description: Cross-site collection refused
        "429":
          description: Too many visits
        "503":
          description: Collector unavailable
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Private website traffic statistics for the existing authorized administrator
      security:
        - clerkSession: []
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: end
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Traffic estimates; dates and days use Europe/Paris
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficReport"
        "400":
          description: Invalid range or dates outside the 90-day retention window
        "401":
          description: Authentication required
        "403":
          description: Administrator access denied
        "503":
          description: Analytics unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /billing/plans:
    get:
      operationId: getBillingPlans
      tags: [billing]
      summary: Check Premium plans available in the current Stripe environment
      responses:
        "200":
          description: Environment and available Premium plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlans"
  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Get the authenticated user's Stripe subscription status
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          description: Authentication required
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      summary: Create a Premium subscription or donation checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutInput"
      responses:
        "200":
          description: Stripe Checkout redirect URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckout"
        "400":
          description: Invalid payment selection
        "401":
          description: Authentication required for Premium
        "409":
          description: An existing subscription must be managed first
        "503":
          description: No matching Stripe price configured for this environment
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Create a Stripe subscription-management portal session
      security:
        - clerkSession: []
      responses:
        "200":
          description: Stripe customer portal redirect URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckout"
        "401":
          description: Authentication required
        "404":
          description: No Stripe subscription exists for this account
  /store/catalog:
    get:
      operationId: getStoreCatalog
      tags: [store]
      summary: Read the isolated INDAMORA PLAY storefront catalog
      responses:
        "200":
          description: Store catalog and TEST checkout readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCatalog"
  /store/checkout:
    post:
      operationId: createStoreCheckout
      tags: [store]
      summary: Create an environment-specific one-time Stripe Checkout for store items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCheckoutInput"
      responses:
        "200":
          description: Secure Stripe TEST Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCheckout"
        "400":
          description: Invalid items or unsupported shipping country
        "503":
          description: Store catalog or signed environment-specific webhook is not ready
  /store/checkout/status:
    get:
      operationId: getStoreCheckoutStatus
      tags: [store]
      summary: Verify a completed store Checkout with Stripe, not the browser return URL
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            pattern: '^cs_(test|live)_[A-Za-z0-9_]+$'
            minLength: 10
      responses:
        "200":
          description: Environment-specific Checkout payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCheckoutStatus"
        "400":
          description: Invalid Checkout session id
        "404":
          description: No matching INDAMORA PLAY store session in this environment
        "503":
          description: The dedicated Stripe store configuration is unavailable
  /store/stripe/webhook:
    post:
      operationId: receiveStoreTestWebhook
      tags: [store]
      summary: Receive a signed Boutique-only TEST event without database writes
      description: Development only. Uses a dedicated signature secret, the raw body, and authoritative Stripe TEST payment confirmation. Repeated deliveries have no business side effects.
      parameters:
        - in: header
          name: stripe-signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeWebhookPayload"
      responses:
        "200":
          description: Valid TEST event acknowledged or unrelated event ignored
        "400":
          description: Invalid signature or not a TEST event
        "404":
          description: Not available in production
        "503":
          description: Dedicated signature secret or Stripe TEST confirmation unavailable
  /stripe/webhook:
    post:
      operationId: receiveStripeWebhook
      tags: [billing]
      summary: Receive a signed Stripe webhook event
      description: The raw request body is verified using the Stripe signature before processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeWebhookPayload"
      responses:
        "200":
          description: Signed event accepted
        "400":
          description: Missing or invalid signature/event
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: List featured content
      responses:
        "200":
          description: Public content catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Work"
  /catalog/{id}:
    get:
      operationId: getWork
      tags: [catalog]
      summary: Get a work by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Work details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Work"
        "404":
          description: Work not found
  /artists:
    get:
      operationId: getArtists
      tags: [artists]
      summary: List public directory profiles
      parameters:
        - name: group
          in: query
          required: false
          schema:
            type: string
            enum: [artists, creations, partners, press]
        - name: subcategory
          in: query
          required: false
          schema: { type: string }
        - name: country
          in: query
          required: false
          schema: { type: string }
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Artist profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artist"
    post:
      operationId: createArtist
      tags: [artists]
      summary: Create an artist profile
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtistInput"
      responses:
        "201":
          description: Artist profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
  /artists/{id}:
    get:
      operationId: getArtist
      tags: [artists]
      summary: Get an artist profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "404":
          description: Artist not found
  /press-requests:
    post:
      operationId: createPressRequest
      tags: [press]
      summary: Send a press or media request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PressRequestInput"
      responses:
        "201":
          description: Press request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PressRequest"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List registered users for administrators
      security:
        - clerkSession: []
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of registered Clerk users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersPage"
        "400":
          description: Invalid pagination offset
        "401":
          description: Authentication required
        "403":
          description: Administrator access denied
  /admin/content:
    get:
      operationId: getAdminContent
      tags: [admin]
      security:
        - clerkSession: []
      responses:
        "200":
          description: Directory profiles and published catalogue works
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContent"
        "401":
          description: Authentication required
        "403":
          description: Administrator access denied
  /admin/profiles/{id}:
    delete:
      operationId: deleteAdminProfile
      tags: [admin]
      description: Deletes only the selected directory profile, never its Clerk account or works.
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionConfirmation"
      responses:
        "204":
          description: Profile deleted
        "400":
          description: Invalid identifier or missing confirmation
        "401":
          description: Authentication required
        "403":
          description: Administrator access denied
        "404":
          description: Profile not found
  /admin/works/{id}:
    delete:
      operationId: deleteAdminWork
      tags: [admin]
      description: Deletes only the selected published work and detaches its submission references. Shared or unverified files are retained.
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionConfirmation"
      responses:
        "204":
          description: Published work deleted
        "400":
          description: Invalid identifier or missing confirmation
        "401":
          description: Authentication required
        "403":
          description: Administrator access denied
        "404":
          description: Work not found
  /admin/demo-cleanup:
    post:
      operationId: cleanupAdminDemos
      tags: [admin]
      description: Removes only the previously verified demonstration fingerprints. Uncertain records, including the later Nzelé publication, are preserved.
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionConfirmation"
      responses:
        "200":
          description: Exact demonstration cleanup counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoCleanupResult"
        "400":
          description: Confirmation required
        "401":
          description: Authentication required
        "403":
          description: Administrator access denied
  /submissions:
    get:
      operationId: getSubmissions
      tags: [submissions]
      summary: List work submissions
      security:
        - clerkSession: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Submitted works
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a work for review
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /submissions/{id}/status:
    patch:
      operationId: updateSubmissionStatus
      tags: [submissions]
      summary: Update a submission review status
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionStatusInput"
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a presigned URL for direct upload
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /storage/uploads/complete:
    post:
      operationId: completeUpload
      tags: [Storage]
      summary: Attach owner ACL metadata to an uploaded object
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "200":
          description: Uploaded object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteUploadResult"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [Storage]
      summary: Serve a public object
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema: { type: string, format: binary }
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [Storage]
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema: { type: string, format: binary }
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    ShopCrop:
      type: object
      required: [x, y, w, h, ratio]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        w: { type: number, exclusiveMinimum: 0, maximum: 1 }
        h: { type: number, exclusiveMinimum: 0, maximum: 1 }
        ratio: { type: number, exclusiveMinimum: 0, maximum: 100 }
    ShopPhoto:
      type: object
      required: [reference]
      properties:
        reference: { type: string, maxLength: 200 }
        crop:
          $ref: "#/components/schemas/ShopCrop"
    ShopVariant:
      type: object
      required: [id, color, size, stock, photos]
      properties:
        id: { type: string, pattern: '^[a-z0-9_-]{1,64}$' }
        color: { type: string, maxLength: 60 }
        size: { type: string, minLength: 1, maxLength: 60 }
        stock: { type: ["integer", "null"], minimum: 0, maximum: 100000 }
        photos:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/ShopPhoto"
    ShopProductInput:
      type: object
      required: [name, description, category, priceCents, status, visible, shippingInfo, variants]
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        description: { type: string, maxLength: 4000 }
        category: { type: string, minLength: 1, maxLength: 80 }
        priceCents: { type: integer, minimum: 1, maximum: 1000000 }
        status: { type: string, enum: [draft, active, hidden, archived] }
        visible: { type: boolean }
        shippingInfo: { type: string, maxLength: 1000 }
        variants:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/ShopVariant"
    ShopProduct:
      allOf:
        - $ref: "#/components/schemas/ShopProductInput"
        - type: object
          required: [id, revision, updatedAt]
          properties:
            id: { type: string }
            revision: { type: integer }
            updatedAt: { type: string }
    ShopProductUpdateInput:
      allOf:
        - $ref: "#/components/schemas/ShopProductInput"
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, minimum: 0 }
    ShopHistoryEntry:
      type: object
      required: [id, productId, at, action, detail]
      properties:
        id: { type: string }
        productId: { type: string }
        at: { type: string }
        action: { type: string }
        detail: { type: string }
    ShopCartItem:
      type: object
      required: [productId, variantId, quantity]
      properties:
        productId: { type: string, maxLength: 80 }
        variantId: { type: string, maxLength: 64 }
        quantity: { type: integer, minimum: 1, maximum: 20 }
    ShopReservation:
      type: object
      required: [id, status, expiresAt, items]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, paid, released] }
        expiresAt: { type: string }
        sessionId: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShopCartItem"
    ShopState:
      type: object
      required: [version, products, history, reservations]
      properties:
        version: { type: integer, const: 1 }
        products:
          type: array
          items:
            $ref: "#/components/schemas/ShopProduct"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ShopHistoryEntry"
        reservations:
          type: array
          items:
            $ref: "#/components/schemas/ShopReservation"
    ShopDashboard:
      type: object
      required: [products, history, active, inactive, outOfStock, lowStock, unknownStock]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ShopProduct"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ShopHistoryEntry"
        active: { type: integer }
        inactive: { type: integer }
        outOfStock: { type: integer }
        lowStock: { type: integer }
        unknownStock: { type: integer }
    ShopPublicVariant:
      type: object
      required: [id, color, size, photos, available]
      properties:
        id: { type: string }
        color: { type: string }
        size: { type: string }
        available: { type: boolean }
        photos:
          type: array
          items:
            $ref: "#/components/schemas/ShopPhoto"
    ShopPublicProduct:
      type: object
      required: [id, name, description, category, priceCents, shippingInfo, variants]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        priceCents: { type: integer }
        shippingInfo: { type: string }
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ShopPublicVariant"
    ShopPublicCatalog:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ShopPublicProduct"
    ShopPhotoUpload:
      type: object
      required: [contentType, base64]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        base64: { type: string, minLength: 4, maxLength: 6990520 }
    ShopPhotoRequest:
      type: object
      required: [contentType, size]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
    ShopPhotoCompletion:
      type: object
      required: [reference]
      properties:
