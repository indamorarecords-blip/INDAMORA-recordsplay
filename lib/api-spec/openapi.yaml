openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Public catalog operations
  - name: artists
    description: Artist profile operations
  - name: submissions
    description: INDAMORA RECORDS moderation operations
  - name: press
    description: Public press contact operations
  - name: billing
    description: INDAMORA Premium and Stripe checkout operations
  - name: admin
    description: Private administration operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /analytics/pageviews:
    post:
      operationId: recordPageview
      tags: [admin]
      summary: Record an anonymous public page visit; never returns statistics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageviewInput"
      responses:
        "204":
          description: Visit accepted or excluded by privacy and bot filters
        "400":
          description: Invalid public page
        "403":
          description: Cross-site collection refused
        "429":
          description: Too many visits
        "503":
          description: Collector unavailable
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Private website traffic statistics for the existing authorized administrator
      security:
        - clerkSession: []
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: end
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Traffic estimates; dates and days use Europe/Paris
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficReport"
        "400":
          description: Invalid range or dates outside the 90-day retention window
        "401":
          description: Authentication required
        "403":
          description: Administrator access denied
        "503":
          description: Analytics unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /billing/plans:
    get:
      operationId: getBillingPlans
      tags: [billing]
      summary: Check Premium plans available in the current Stripe environment
      responses:
        "200":
          description: Environment and available Premium plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlans"
  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Get the authenticated user's Stripe subscription status
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          description: Authentication required
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      summary: Create a Premium subscription or donation checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutInput"
      responses:
        "200":
          description: Stripe Checkout redirect URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckout"
        "400":
          description: Invalid payment selection
        "401":
          description: Authentication required for Premium
        "409":
          description: An existing subscription must be managed first
        "503":
          description: No matching Stripe price configured for this environment
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Create a Stripe subscription-management portal session
      security:
        - clerkSession: []
      responses:
        "200":
          description: Stripe customer portal redirect URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckout"
        "401":
          description: Authentication required
        "404":
          description: No Stripe subscription exists for this account
  /stripe/webhook:
    post:
      operationId: receiveStripeWebhook
      tags: [billing]
      summary: Receive a signed Stripe webhook event
      description: The raw request body is verified using the Stripe signature before processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeWebhookPayload"
      responses:
        "200":
          description: Signed event accepted
        "400":
          description: Missing or invalid signature/event
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: List featured content
      responses:
        "200":
          description: Public content catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Work"
  /catalog/{id}:
    get:
      operationId: getWork
      tags: [catalog]
      summary: Get a work by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Work details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Work"
        "404":
          description: Work not found
  /artists:
    get:
      operationId: getArtists
      tags: [artists]
      summary: List public directory profiles
      parameters:
        - name: group
          in: query
          required: false
          schema:
            type: string
            enum: [artists, creations, partners, press]
        - name: subcategory
          in: query
          required: false
          schema: { type: string }
        - name: country
          in: query
          required: false
          schema: { type: string }
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Artist profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artist"
    post:
      operationId: createArtist
      tags: [artists]
      summary: Create an artist profile
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtistInput"
      responses:
        "201":
          description: Artist profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
  /artists/{id}:
    get:
      operationId: getArtist
      tags: [artists]
      summary: Get an artist profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "404":
          description: Artist not found
  /press-requests:
    post:
      operationId: createPressRequest
      tags: [press]
      summary: Send a press or media request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PressRequestInput"
      responses:
        "201":
          description: Press request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PressRequest"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List registered users for administrators
      security:
        - clerkSession: []
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of registered Clerk users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersPage"
        "400":
          description: Invalid pagination offset
        "401":
          description: Authentication required
        "403":
          description: Administrator access denied
  /admin/content:
    get:
      operationId: getAdminContent
      tags: [admin]
      security:
        - clerkSession: []
      responses:
        "200":
          description: Directory profiles and published catalogue works
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContent"
        "401":
          description: Authentication required
        "403":
          description: Administrator access denied
  /admin/profiles/{id}:
    delete:
      operationId: deleteAdminProfile
      tags: [admin]
      description: Deletes only the selected directory profile, never its Clerk account or works.
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionConfirmation"
      responses:
        "204":
          description: Profile deleted
        "400":
          description: Invalid identifier or missing confirmation
        "401":
          description: Authentication required
        "403":
          description: Administrator access denied
        "404":
          description: Profile not found
  /admin/works/{id}:
    delete:
      operationId: deleteAdminWork
      tags: [admin]
      description: Deletes only the selected published work and detaches its submission references. Shared or unverified files are retained.
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionConfirmation"
      responses:
        "204":
          description: Published work deleted
        "400":
          description: Invalid identifier or missing confirmation
        "401":
          description: Authentication required
        "403":
          description: Administrator access denied
        "404":
          description: Work not found
  /admin/demo-cleanup:
    post:
      operationId: cleanupAdminDemos
      tags: [admin]
      description: Removes only the previously verified demonstration fingerprints. Uncertain records, including the later Nzelé publication, are preserved.
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionConfirmation"
      responses:
        "200":
          description: Exact demonstration cleanup counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoCleanupResult"
        "400":
          description: Confirmation required
        "401":
          description: Authentication required
        "403":
          description: Administrator access denied
  /submissions:
    get:
      operationId: getSubmissions
      tags: [submissions]
      summary: List work submissions
      security:
        - clerkSession: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Submitted works
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a work for review
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /submissions/{id}/status:
    patch:
      operationId: updateSubmissionStatus
      tags: [submissions]
      summary: Update a submission review status
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionStatusInput"
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a presigned URL for direct upload
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /storage/uploads/complete:
    post:
      operationId: completeUpload
      tags: [Storage]
      summary: Attach owner ACL metadata to an uploaded object
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "200":
          description: Uploaded object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteUploadResult"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [Storage]
      summary: Serve a public object
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema: { type: string, format: binary }
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [Storage]
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema: { type: string, format: binary }
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    PageviewInput:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 160 }
    TrafficReport:
      type: object
      required: [start, end, timezone, visitors, pageviews, daily, countries, pages, firstCollectedAt, retentionDays, geoipRelease, geoipStatus]
      properties:
        start: { type: string }
        end: { type: string }
        timezone: { type: string }
        visitors: { type: integer, minimum: 0 }
        pageviews: { type: integer, minimum: 0 }
        retentionDays: { type: integer }
        firstCollectedAt: { type: ["string", "null"], format: date-time }
        geoipRelease: { type: ["string", "null"] }
        geoipStatus: { type: string, enum: [ready, stale, unavailable] }
        daily:
          type: array
          items:
            $ref: "#/components/schemas/TrafficDay"
        countries:
          type: array
          items:
            $ref: "#/components/schemas/TrafficCountry"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/TrafficPage"
    TrafficDay:
      type: object
      required: [date, visitors, pageviews]
      properties:
        date: { type: string }
        visitors: { type: integer, minimum: 0 }
        pageviews: { type: integer, minimum: 0 }
    TrafficCountry:
      type: object
      required: [country, visitors, pageviews]
      properties:
        country: { type: ["string", "null"] }
        visitors: { type: integer, minimum: 0 }
        pageviews: { type: integer, minimum: 0 }
    TrafficPage:
      type: object
      required: [path, visitors, pageviews]
      properties:
        path: { type: string }
        visitors: { type: integer, minimum: 0 }
        pageviews: { type: integer, minimum: 0 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BillingPlanAvailability:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
    BillingPlans:
      type: object
      required: [available, mode, webhookReady, plans]
      properties:
        available: { type: boolean }
        webhookReady:
          type: boolean
          description: False in development without a verified test webhook; in production, true only when a live signed webhook endpoint is configured.
        mode:
          type: string
          enum: [test, live, unavailable]
        reason: { type: string }
        plans:
          type: object
          required: [africa, international]
          properties:
            africa:
              $ref: "#/components/schemas/BillingPlanAvailability"
            international:
              $ref: "#/components/schemas/BillingPlanAvailability"
    BillingStatus:
      type: object
      required: [status, isPremium, subscription]
      properties:
        status: { type: string }
        isPremium: { type: boolean }
        subscription:
          oneOf:
            - $ref: "#/components/schemas/BillingSubscription"
            - type: "null"
    BillingSubscription:
      type: object
      required: [id, status, currentPeriodEnd, cancelAtPeriodEnd, priceId]
      properties:
        id: { type: string }
        status: { type: string }
        currentPeriodEnd: { type: ["integer", "null"] }
        cancelAtPeriodEnd: { type: boolean }
        priceId: { type: ["string", "null"] }
    BillingCheckoutInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [subscription, donation]
        plan:
          type: string
          enum: [africa, international]
        amountEur:
          type: integer
          enum: [1, 5, 10, 20, 50, 100]
    BillingCheckout:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    BillingError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    AdminUser:
      type: object
      required: [id, firstName, lastName, username, email, phoneNumber, createdAt, profiles]
      properties:
        id: { type: string }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        username: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phoneNumber: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        profiles:
          type: array
          description: Artist directory profiles linked to this Clerk account; empty when none are linked.
          items:
            $ref: "#/components/schemas/AdminArtistProfile"
    AdminArtistProfile:
      type: object
      required: [id, name, category, bio, location, avatar, worksCount, ownerId, profileGroup, subcategory, country, specialties, website, socialLinks, professionalContact, profileStatus, isPublished, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        bio: { type: string }
        location: { type: string }
        avatar: { type: ["string", "null"] }
        worksCount: { type: integer }
        ownerId: { type: ["string", "null"] }
        profileGroup: { type: string }
        subcategory: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        specialties:
          type: array
          items: { type: string }
        website: { type: ["string", "null"] }
        socialLinks:
          type: array
          items: { type: string }
        professionalContact: { type: ["string", "null"] }
        profileStatus: { type: string }
        isPublished: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdminUsersPage:
      type: object
      required: [users, totalCount, offset, limit]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        totalCount: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
    DeletionConfirmation:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean, enum: [true] }
    AdminContent:
      type: object
      required: [profiles, works]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/AdminArtistProfile"
        works:
          type: array
          items:
            $ref: "#/components/schemas/Work"
    DemoCleanupResult:
      type: object
      required: [profiles, works, submissions]
      properties:
        profiles: { type: integer, minimum: 0 }
        works: { type: integer, minimum: 0 }
        submissions: { type: integer, minimum: 0 }
    Artist:
      type: object
      required: [id, name, category, bio, location, worksCount, profileGroup, specialties, socialLinks]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        bio: { type: string }
        location: { type: string }
        avatar: { type: ["string", "null"] }
        worksCount: { type: integer }
        profileGroup:
          type: string
          enum: [artists, creations, partners, press]
        subcategory: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        specialties:
          type: array
          items: { type: string }
        website: { type: ["string", "null"], format: uri }
        socialLinks:
          type: array
          items: { type: string, format: uri }
        professionalContact: { type: ["string", "null"] }
    ArtistInput:
      type: object
      required: [name, category, bio, location]
      properties:
        name: { type: string, minLength: 2 }
        category: { type: string, minLength: 2 }
        bio: { type: string, minLength: 10 }
        location: { type: string, minLength: 2 }
        avatar: { type: string }
        profileGroup:
          type: string
          enum: [artists, creations, partners, press]
        subcategory: { type: string }
        country: { type: string }
        specialties:
          type: array
          items: { type: string }
        website: { type: string, format: uri }
        socialLinks:
          type: array
          items: { type: string, format: uri }
        professionalContact: { type: string }
    PressRequest:
      type: object
      required: [id, name, organization, role, email, requestType, subject, message, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        organization: { type: string }
        role: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        requestType: { type: string }
        subject: { type: string }
        message: { type: string }
        requestedDate: { type: ["string", "null"] }
        status: { type: string, enum: [pending, handled, archived] }
        createdAt: { type: string }
    PressRequestInput:
      type: object
      required: [name, organization, role, email, requestType, subject, message]
      properties:
        name: { type: string, minLength: 2 }
        organization: { type: string, minLength: 2 }
        role: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string }
        requestType: { type: string, minLength: 2 }
        subject: { type: string, minLength: 2 }
        message: { type: string, minLength: 10 }
        requestedDate: { type: string }
    Work:
      type: object
      required: [id, title, artist, category, description, duration, image, featured, access, mediaType, mediaObjectPath, coverObjectPath]
      properties:
        id: { type: integer }
        title: { type: string }
        artist: { type: string }
        category: { type: string }
        description: { type: string }
        duration: { type: ["string", "null"] }
        image: { type: string }
        mediaType: { type: ["string", "null"] }
        mediaObjectPath: { type: ["string", "null"] }
        coverObjectPath: { type: ["string", "null"] }
        featured: { type: boolean }
        access:
          type: string
          enum: [free, premium]
    Submission:
      type: object
      required: [id, title, artist, category, submittedAt, status]
      properties:
        id: { type: integer }
        title: { type: string }
        artist: { type: string }
        category: { type: string }
        submittedAt: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
        note: { type: ["string", "null"] }
        mediaType: { type: ["string", "null"] }
        mediaObjectPath: { type: ["string", "null"] }
        coverObjectPath: { type: ["string", "null"] }
        duration: { type: ["string", "null"] }
    SubmissionInput:
      type: object
      required: [title, artist, category, mediaType, mediaObjectPath]
      properties:
        title: { type: string, minLength: 2 }
        artist: { type: string, minLength: 2 }
        category: { type: string, minLength: 2 }
        note: { type: string }
        mediaType:
          type: string
          enum: [audio, video]
        mediaObjectPath: { type: string, minLength: 1 }
        coverObjectPath: { type: string, minLength: 1 }
        duration: { type: string }
    SubmissionStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
